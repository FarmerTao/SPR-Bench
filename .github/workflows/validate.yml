name: Validate benchmark
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/scaffold.py --check
      - run: python tools/check_tasks.py
      - run: harbor lint tasks/life-sciences/biology/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: calibration-records
          path: tasks/life-sciences/biology/*/authoring/calibration.md
